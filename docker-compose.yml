services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rrm
      POSTGRES_PASSWORD: rrm
      POSTGRES_DB: rrm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rrm"]
      interval: 5s
      retries: 10

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://rrm:rrm@db:5432/rrm
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
